server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # chamadas /api vão para o container do backend
  location /api/ {
    proxy_pass http://backend:3333;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # React Router: qualquer outra rota abre o index.html
  location / {
    try_files $uri /index.html;
  }
}
